server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:holdmyseat}
    password: ${DB_PASSWORD:holdmyseat}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

holdmyseat:
  jwt:
    issuer: holdmyseat-auth
    key-id: holdmyseat-key-1
    access-ttl: 15m
    refresh-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
