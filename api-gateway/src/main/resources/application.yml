server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_URI:http://localhost:8081}/.well-known/jwks.json
  cloud:
    gateway:
      routes:
        - id: auth-login
          uri: ${AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/login
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5

        - id: auth
          uri: ${AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: catalog
          uri: ${CATALOG_URI:http://localhost:8082}
          predicates:
            - Path=/api/catalog/**,/api/admin/catalog/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        # Tighter bucket for the seat-hold hot path.
        - id: booking-holds
          uri: ${BOOKING_URI:http://localhost:8083}
          predicates:
            - Path=/api/holds/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
            - name: CircuitBreaker
              args:
                name: booking

        - id: booking
          uri: ${BOOKING_URI:http://localhost:8083}
          predicates:
            - Path=/api/bookings/**
          filters:
            - name: CircuitBreaker
              args:
                name: booking

        - id: payment
          uri: ${PAYMENT_URI:http://localhost:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment

        - id: seat-events
          uri: ${SEAT_EVENTS_WS_URI:ws://localhost:8086}
          predicates:
            - Path=/ws/**

      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
